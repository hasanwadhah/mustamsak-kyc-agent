<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Verdict: hand over to a person. Silhouette: round medallion. Key light top-left. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#d98c1b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d98c1b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0f1f2e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0f1f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#f7c267"/>
      <stop offset=".45" stop-color="#df8f1c"/>
      <stop offset="1" stop-color="#9c5700"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style id="motion">
    .hero{transform-origin:64px 62px;animation:pop .44s cubic-bezier(.2,.9,.3,1.25) both}
    .focal{stroke-dasharray:40;animation:draw .32s .32s cubic-bezier(.4,0,.2,1) both}
    @keyframes pop{from{transform:scale(.82);opacity:0}}
    @keyframes draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.hero,.focal{animation:none}}
  </style>
  <circle cx="64" cy="60" r="58" fill="url(#halo)"/>
  <ellipse cx="64" cy="114" rx="30" ry="6" fill="url(#ground)"/>
  <g class="hero">
    <circle cx="64" cy="64" r="44" fill="#8a4d00"/>
    <circle cx="64" cy="60" r="44" fill="url(#body)"/>
    <circle cx="64" cy="60" r="37" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <path d="M64 19a41 41 0 0 0-41 41c0 5 4 6 6 2 6-17 19-30 35-35 4-1 4-8 0-8Z" fill="url(#sheen)"/>
    <circle cx="55" cy="50" r="11" fill="#fff" fill-opacity=".96"/>
    <path d="M33 86c0-13 9.5-21 22-21s22 8 22 21" fill="#fff" fill-opacity=".96"/>
    <path class="focal" d="M76 60l8 8 15-16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
