<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Verdict: waiting for documents. Silhouette: rounded square. Key light top-left. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#556575" stop-opacity=".18"/>
      <stop offset="1" stop-color="#556575" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0f1f2e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0f1f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#8d9cab"/>
      <stop offset=".45" stop-color="#5a6b7c"/>
      <stop offset="1" stop-color="#34424f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style id="motion">
    .hero{transform-origin:64px 62px;animation:pop .44s cubic-bezier(.2,.9,.3,1.25) both}
    .focal{transform-origin:64px 60px;animation:turn 2.4s linear infinite}
    @keyframes pop{from{transform:scale(.82);opacity:0}}
    @keyframes turn{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.hero,.focal{animation:none}}
  </style>
  <circle cx="64" cy="60" r="58" fill="url(#halo)"/>
  <ellipse cx="64" cy="114" rx="30" ry="6" fill="url(#ground)"/>
  <g class="hero">
    <rect x="22" y="22" width="84" height="84" rx="24" fill="#26323d"/>
    <rect x="22" y="18" width="84" height="84" rx="24" fill="url(#body)"/>
    <rect x="29" y="25" width="70" height="70" rx="18" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    <path d="M46 21h36c-19 3-34 15-41 33-2 4-7 3-7-2V33c0-7 5-12 12-12Z" fill="url(#sheen)"/>
    <circle cx="64" cy="60" r="25" fill="none" stroke="#fff" stroke-width="7"/>
    <path d="M64 60V46" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path class="focal" d="M64 60l10 6" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
