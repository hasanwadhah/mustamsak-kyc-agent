<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The agent is reading: an ID card inside a scan frame, a beam sweeping over it. Key light top-left.
       Shown small next to the reading title, so no halo or ground shadow (tight crop). -->
  <defs>
    <linearGradient id="card" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef6f4"/>
      <stop offset="1" stop-color="#d6e7e3"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d8d1"/>
      <stop offset="1" stop-color="#8fbfb4"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c9a8a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#11685d"/>
      <stop offset="1" stop-color="#2c9a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c9a8a" stop-opacity="0"/>
      <stop offset="1" stop-color="#2c9a8a" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <style id="motion">
    .sweep{animation:sweep 1.8s cubic-bezier(.45,0,.55,1) infinite alternate}
    @keyframes sweep{from{transform:translateY(-26px)}to{transform:translateY(26px)}}
    @media (prefers-reduced-motion:reduce){.sweep{animation:none}}
  </style>
  <rect x="21" y="34" width="86" height="60" rx="9" fill="#0a4c44" fill-opacity=".18" transform="translate(0 4)"/>
  <rect x="21" y="34" width="86" height="60" rx="9" fill="url(#card)" stroke="#c3d8d3" stroke-width="1.5"/>
  <path d="M24 44c0-5 3-7 7-7h40c-17 3-31 10-43 22-2 2-4 1-4-2Z" fill="#fff" fill-opacity=".8"/>
  <rect x="30" y="45" width="22" height="28" rx="4" fill="url(#photo)"/>
  <circle cx="41" cy="55" r="5" fill="#fff" fill-opacity=".8"/>
  <path d="M33 71c1-6 4-8 8-8s7 2 8 8Z" fill="#fff" fill-opacity=".8"/>
  <rect x="60" y="47" width="38" height="5" rx="2.5" fill="#9fbcb6"/>
  <rect x="60" y="58" width="30" height="5" rx="2.5" fill="#b7cdc9"/>
  <rect x="60" y="69" width="34" height="5" rx="2.5" fill="#b7cdc9"/>
  <rect x="30" y="81" width="68" height="5" rx="2.5" fill="#c9dbd7"/>
  <path d="M14 30v-6a8 8 0 0 1 8-8h8M98 16h8a8 8 0 0 1 8 8v6M114 98v6a8 8 0 0 1-8 8h-8M30 112h-8a8 8 0 0 1-8-8v-6"
        fill="none" stroke="#11685d" stroke-width="5" stroke-linecap="round"/>
  <g class="sweep">
    <rect x="18" y="50" width="92" height="14" fill="url(#trail)"/>
    <rect x="16" y="62" width="96" height="3.5" rx="1.75" fill="url(#beam)"/>
  </g>
</svg>
