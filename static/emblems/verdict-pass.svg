<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Verdict: the file passes. Silhouette: shield. Key light top-left. Motion in #motion (stripped for the PNG). -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#157f4c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#157f4c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0f1f2e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0f1f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#4cc98b"/>
      <stop offset=".45" stop-color="#1f9a5d"/>
      <stop offset="1" stop-color="#0d6038"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style id="motion">
    .hero{transform-origin:64px 62px;animation:pop .44s cubic-bezier(.2,.9,.3,1.25) both}
    .focal{stroke-dasharray:66;animation:draw .36s .3s cubic-bezier(.4,0,.2,1) both}
    @keyframes pop{from{transform:scale(.82);opacity:0}}
    @keyframes draw{from{stroke-dashoffset:66}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.hero,.focal{animation:none}}
  </style>
  <circle cx="64" cy="60" r="58" fill="url(#halo)"/>
  <ellipse cx="64" cy="114" rx="30" ry="6" fill="url(#ground)"/>
  <g class="hero">
    <path d="M64 18 100 31V60c0 26-16 42-36 52C44 102 28 86 28 60V31Z" fill="#0b4f2e" transform="translate(0 4)"/>
    <path d="M64 18 100 31V60c0 26-16 42-36 52C44 102 28 86 28 60V31Z" fill="url(#body)"/>
    <path d="M64 26 93 36.5V60c0 21-13 34.5-29 43C48 94.5 35 81 35 60V36.5Z" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <path d="M64 21 31 33V58c0 5 3 7 6 4 7-16 16-27 27-33Z" fill="url(#sheen)"/>
    <path class="focal" d="M46 63l12 12 25-27" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
